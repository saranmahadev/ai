<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Roadmap · Math to Agents</title>
  <meta name="description" content="A soft, 3D clay roadmap through the AI knowledge brain: fundamentals, math, machine learning, deep learning, transformers, LLMs, RAG and agents.">
  <meta name="theme-color" content="#f3ecff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="labels"></div>

  <header class="hud">
    <a class="brand clay-pill" href="#"><span class="dot"></span>AI Roadmap</a>
    <div class="progress clay-pill" aria-live="polite">
      <span id="where">Start</span>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </header>

  <nav id="stages" aria-label="Roadmap stages"><ol></ol></nav>

  <section id="hero">
    <p class="eyebrow">The AI knowledge brain</p>
    <h1>From <em>math</em><br>to <em>agents</em>.</h1>
    <p class="lede">A friendly roadmap through everything in this vault. Scroll to travel the path, tap a milestone to explore it.</p>
    <button id="start" class="cta">Start the journey <span aria-hidden="true">↓</span></button>
  </section>

  <aside id="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden>
    <button id="close" aria-label="Close details">×</button>
    <div id="panel-body"></div>
  </aside>

  <main id="list" aria-label="Roadmap in text form"></main>
  <div id="scroller" aria-hidden="true"></div>

  <noscript><p class="noscript">This roadmap needs JavaScript. The vault itself lives at github.com/saranmahadev/ai.</p></noscript>
  <script type="module" src="main.js"></script>
</body>
</html>
